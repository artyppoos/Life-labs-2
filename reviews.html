<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews - BBCute</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f5;
      color: #242424;
      line-height: 1.7;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER / NAV */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid #ddd;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      font-size: 0.9rem;
      color: #555;
      transition: 0.3s;
    }

    nav a:hover {
      color: #000;
    }

    /* MAIN CONTENT */
    .container {
      padding: 80px 7%;
      max-width: 1000px;
      margin: auto;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
    }

    p {
      color: #666;
      font-size: 1.1rem;
    }

    .back-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background: #242424;
      color: white;
      border-radius: 5px;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: #444;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">BBCute</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="reviews.html">Reviews</a>
    </nav>
  </header>

  <!-- CONTENT -->
  <div class="container">
    <h1>Product & Food Reviews</h1>
    <p>Honest reviews and comparisons coming soon!</p>

    <a href="index.html" class="back-btn">← Back to Main Page</a>
  </div>

</body>
</html>
